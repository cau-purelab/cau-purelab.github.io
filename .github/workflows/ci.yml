# Pull request 검증. deploy.yml은 main push에만 반응하므로, 그것만으로는
# PR이 아무 검사 없이 머지된다 — 실제로 Dependabot PR 2건이 체크 0개로 열렸다.
# 여기서는 배포 없이 deploy.yml과 같은 게이트만 돌려, 깨진 변경이 main에 들어오는 것을 막는다.
name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # scripts/site.cjs의 SITE_URL과 src/constants.tsx의 LAB_URL 정합성
      - name: Validate site configuration
        run: node scripts/site.cjs

      - name: Validate publication data
        run: node scripts/validate_data.cjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /

      # 빌드 산출물이 실제로 기대한 모양인지 확인한다. 라우트별 HTML 생성이 깨지면
      # 배포 후 스모크 테스트에서야 잡히는데, PR 단계에서 먼저 막는 편이 낫다.
      - name: Check build output
        shell: bash
        run: |
          failed=0
          for f in index.html research.html people.html publications.html scholar.html news.html 404.html sitemap.xml robots.txt feed.xml CNAME; do
            if [ -s "dist/$f" ]; then
              echo "ok   dist/$f"
            else
              echo "FAIL dist/$f (없음 또는 빈 파일)"
              failed=1
            fi
          done

          # 라우트마다 canonical이 서로 달라야 한다(전부 같으면 치환이 실패한 것이다)
          uniq_canonical=$(grep -ho 'rel="canonical" href="[^"]*"' dist/research.html dist/people.html dist/scholar.html | sort -u | wc -l)
          if [ "$uniq_canonical" -lt 3 ]; then
            echo "FAIL 라우트별 canonical이 구분되지 않음 ($uniq_canonical/3)"
            failed=1
          else
            echo "ok   라우트별 canonical 구분됨"
          fi

          # 404 페이지는 색인되면 안 된다
          if grep -q noindex dist/404.html; then
            echo "ok   404.html noindex"
          else
            echo "FAIL 404.html에 noindex 없음"
            failed=1
          fi

          exit $failed

      # 초기 번들이 조용히 불어나는 것을 막는다. publications.json은 지연 로드 청크에
      # 남아 있어야 하며, 초기 번들에 합쳐지면 첫 화면 전송량이 몇 배로 뛴다.
      - name: Check bundle budget
        shell: bash
        run: |
          entry=$(ls -S dist/assets/index-*.js | head -1)
          gz=$(gzip -c "$entry" | wc -c)
          kb=$(( gz / 1024 ))
          echo "초기 번들 gzip: ${kb} KB ($entry)"
          if [ "$kb" -gt 130 ]; then
            echo "FAIL 초기 번들 예산 초과 (${kb} KB > 130 KB)"
            exit 1
          fi
          # jcr_source는 publications.json에만 있는 키다. constants.tsx의 대표 논문에도
          # bibtex 문자열이 있으므로 '@article{' 로는 판별할 수 없다(오탐).
          if grep -q 'jcr_source' "$entry"; then
            echo "FAIL 논문 데이터가 초기 번들에 포함됨 — 지연 로드 분할이 깨졌다"
            exit 1
          fi
          echo "ok   번들 예산·코드 분할 정상"
