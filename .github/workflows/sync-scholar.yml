# 매주 Google Sites/Scholar를 대조해 논문 데이터 변경을 감지하고,
# 변경이 있으면 자동으로 PR을 생성한다 (main 직접 push = 즉시 배포이므로 PR로 검토 후 머지).
#
# ⚠ 선행 조건 — 저장소 설정 토글 (코드로는 고칠 수 없음):
#   Settings → Actions → General → Workflow permissions →
#   "Allow GitHub Actions to create and approve pull requests" 를 켤 것.
#   이게 꺼져 있으면 마지막 단계가 매번
#   `GitHub Actions is not permitted to create or approve pull requests` 로 실패한다.
#   (브랜치 push는 성공하므로 데이터는 auto/scholar-sync 브랜치에 쌓이지만 PR이 열리지 않는다.)
#
# 주의: Google Scholar가 GitHub Actions IP를 차단(429/403)하면 이 워크플로우는 실패할 수 있음.
# 그 경우 로컬에서 `node scripts/sync_scholar.cjs --apply`를 수동 실행할 것.
name: Weekly Scholar Sync

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # 실패 시 이슈 생성/코멘트

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 스크립트는 node 내장 모듈만 사용하므로 npm install 불필요.
      # shell: bash → GitHub이 `-eo pipefail`로 실행한다. 이게 없으면 파이프 앞 스크립트가
      # exit 1로 죽어도 tee의 성공 코드에 가려져 워크플로가 계속 진행된다.
      - name: Run scholar sync (apply)
        shell: bash
        run: node scripts/sync_scholar.cjs --apply 2>&1 | tee "$RUNNER_TEMP/sync-report.txt"

      - name: Update scholar metrics
        shell: bash
        run: node scripts/update_scholar_metrics.cjs

      - name: Validate data
        shell: bash
        run: |
          node scripts/site.cjs
          node scripts/validate_data.cjs

      # add-paths에 src/constants.tsx를 남겨 두는 이유:
      # PUBLICATIONS_UPDATED_AT을 sync 스크립트가 constants.tsx에서 갱신한다.
      # 이 값을 publications.json의 _meta로 옮기기 전까지는 두 파일을 함께 커밋해야
      # 화면의 "Data last updated"가 실제 데이터와 어긋나지 않는다.
      - name: Create pull request if changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            src/data/publications.json
            src/constants.tsx
          commit-message: 'Weekly scholar data sync'
          title: 'Weekly scholar data sync'
          body-path: ${{ runner.temp }}/sync-report.txt
          branch: auto/scholar-sync
          delete-branch: true

      # 실패를 아무도 모르고 지나가지 않게 이슈로 남긴다(예약 실행은 알림이 약하다).
      # 같은 제목의 열린 이슈가 있으면 코멘트만 추가해 이슈가 매주 쌓이는 것을 막는다.
      - name: Report failure as an issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Weekly Scholar Sync failed'
          body=$(printf '%s\n' \
            "주간 Scholar 동기화가 실패했습니다." \
            "" \
            "- 실행 로그: $RUN_URL" \
            "" \
            "자주 나오는 원인:" \
            "1. \`GitHub Actions is not permitted to create or approve pull requests\`" \
            "   → Settings → Actions → General → Workflow permissions에서" \
            "     'Allow GitHub Actions to create and approve pull requests'를 켤 것." \
            "2. Google Scholar가 러너 IP를 차단(429/403)" \
            "   → 로컬에서 \`node scripts/sync_scholar.cjs --apply\`를 수동 실행할 것." \
            "3. validate_data.cjs 실패 → 수집 데이터 이상. 로그의 검증 실패 목록을 확인할 것.")
          existing=$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
