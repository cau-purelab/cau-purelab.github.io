# 학회 투고 플래너(숨김 페이지) 주간 변경 감지.
# 공식 페이지를 다시 읽어 (1) 기록한 마감 날짜가 사라졌는지, (2) 새 날짜가 나타났는지(예상이던 회차에 CFP가 올라오거나
# 연장 공지가 붙은 경우)를 찾아 **이슈로 알린다. 데이터를 자동으로 고치거나 배포하지 않는다** — 틀린 날짜가 구성원에게
# 그대로 보이는 것을 막으려는 설계다. 알림을 받으면 공식 페이지를 직접 확인하고 tools/conf-planner/data/overrides.json을
# 고친 뒤 node tools/conf-planner/build.cjs 결과와 함께 커밋한다.
#
# 이 워크플로가 main에 커밋하는 것은 기준선 파일(tools/conf-planner/data/page-baseline.json) 하나뿐이다.
# GITHUB_TOKEN으로 한 푸시는 다른 워크플로(deploy.yml)를 깨우지 않으므로 배포는 일어나지 않고, 라이브 페이지도 바뀌지 않는다.
#
# 한계: 일부 학회 사이트는 러너 IP를 막거나(403) 날짜를 JS로 그려서 보고서의 "읽지 못한 페이지"·오탐으로 나온다.
#   Scholar 동기화처럼 차단이 이어질 수 있다. 읽지 못한 페이지의 기준선은 그대로 두므로 다음 주에 다시 시도한다.
name: Conf Planner Check

on:
  schedule:
    # 월요일 00:41 UTC(09:41 KST). 정각을 피한 것은 예약 실행이 정각에 몰려 밀리기 때문이다(sync-scholar.yml과 같은 이유).
    - cron: '41 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: conf-planner-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 변경 감지
        id: check
        run: |
          set -o pipefail
          node tools/conf-planner/check-changes.cjs --out "$RUNNER_TEMP/report.md" | tee "$RUNNER_TEMP/out.txt"
          echo "findings=$(grep -o 'FINDINGS=[0-9]*' "$RUNNER_TEMP/out.txt" | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: 기준선 저장
        run: |
          git add tools/conf-planner/data/page-baseline.json
          if git diff --cached --quiet; then
            echo "기준선 변화 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update conf planner page baseline"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 이슈로 알림
        if: steps.check.outputs.findings != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 이슈 본문 한도(65536자) 안에 들도록 자른다
          head -c 60000 "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/body.md"
          gh label create conf-planner --color 0e8a16 --description "투고 플래너 변경 감지" 2>/dev/null || true
          open=$(gh issue list --label conf-planner --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --label conf-planner \
              --title "투고 플래너: 공식 페이지 변경 확인 필요 ($(date -u +%Y-%m-%d))" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conf-planner-report
          path: ${{ runner.temp }}/report.md
          if-no-files-found: ignore
          retention-days: 30
