<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- [소유 확인] Google Search Console. content에는 토큰만 넣는다 —
       "google-site-verification=" 접두어가 붙는 형태는 DNS TXT 레코드 방식의 값이고,
       HTML 태그 방식에 그대로 넣으면 확인에 실패한다. -->
  <meta name="google-site-verification" content="DHIDkXbHfWxnA68I6tbWxNyaBXlkH3miEXNOq8ua68U" />

  <!-- [파비콘] PURE 마크 -->
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />

  <!-- 보안: base 태그 주입/플러그인 임베드/외부 폼 전송을 차단.
       script-src·style-src는 아직 넣지 않는다 — 폰트 링크의 인라인 onload 핸들러와
       Google Fonts 스타일시트가 함께 막히기 때문. 폰트 self-host + HTTPS 확정 후 확장할 것. -->
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- 기본 Title (라우트별 title은 scripts/create-pages-404.cjs가 치환) -->
  <title>PURE Lab, Chung-Ang University — Privacy-Preserving AI Research</title>

  <!-- SEO & Open Graph
       data-rh="true"가 붙은 태그는 react-helmet-async가 라우트 이동 시 회수/교체한다.
       (없으면 Helmet이 만든 태그와 아래 정적 태그가 동시에 남아 canonical/og:url이 2개가 된다)
       빌드 시에는 scripts/create-pages-404.cjs가 라우트별 값으로 치환하므로,
       이 태그들의 구조를 바꾸면 그 스크립트의 치환 패턴도 함께 고쳐야 한다. -->
  <meta data-rh="true" name="description"
    content="PURE Lab at Chung-Ang University, led by Prof. Seungmin Rho, researches privacy-preserving AI, machine unlearning, and robust AI engineering." />
  <link data-rh="true" rel="canonical" href="https://pure.cau.ac.kr/" />
  <link rel="alternate" type="application/rss+xml" title="PURE Lab News" href="/feed.xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PURE Lab" />
  <meta property="og:locale" content="en_US" />
  <meta data-rh="true" property="og:title" content="PURE Lab, Chung-Ang University — Privacy-Preserving AI Research" />
  <meta data-rh="true" property="og:description"
    content="PURE Lab at Chung-Ang University, led by Prof. Seungmin Rho, researches privacy-preserving AI, machine unlearning, and robust AI engineering." />
  <meta data-rh="true" property="og:url" content="https://pure.cau.ac.kr/" />

  <!-- [공유 이미지] PURE Open Graph 이미지 - 절대경로 필수 (1200x630) -->
  <meta data-rh="true" property="og:image" content="https://pure.cau.ac.kr/assets/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="PURE(Privacy, Unlearning, and Robust Engineering Lab), Chung-Ang University" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta data-rh="true" name="twitter:title" content="PURE Lab, Chung-Ang University — Privacy-Preserving AI Research" />
  <meta data-rh="true" name="twitter:description"
    content="PURE Lab at Chung-Ang University, led by Prof. Seungmin Rho, researches privacy-preserving AI, machine unlearning, and robust AI engineering." />
  <meta data-rh="true" name="twitter:image" content="https://pure.cau.ac.kr/assets/og-image.png" />

  <!-- TODO(lab): 검색엔진 등록 — Naver Search Advisor에서 발급한 토큰으로 아래 주석을 해제할 것.
       Google Search Console은 DNS TXT(도메인 속성)로 등록하므로 여기 넣을 태그가 없다.
       <meta name="naver-site-verification" content="발급받은-토큰" /> -->

  <!-- 구조화 데이터: 연구 조직 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ResearchOrganization",
    "name": "PURE(Privacy, Unlearning, and Robust Engineering Lab)",
    "alternateName": "PURE Lab",
    "url": "https://pure.cau.ac.kr/",
    "logo": "https://pure.cau.ac.kr/assets/og-image.png",
    "email": "purelab.cau@gmail.com",
    "foundingDate": "2024-03-04",
    "sameAs": [
      "https://github.com/cau-purelab",
      "https://sites.google.com/view/seungminrho/home"
    ],
    "member": [
      {
        "@type": "Person",
        "name": "Seungmin Rho",
        "jobTitle": "Principal Investigator",
        "sameAs": "https://scholar.google.com/citations?user=k5aAQxUAAAAJ"
      },
      {
        "@type": "Person",
        "name": "Mi Young Lee",
        "jobTitle": "Co-Principal Investigator",
        "sameAs": "https://scholar.google.com/citations?user=bxWgGnoAAAAJ"
      }
    ],
    "parentOrganization": {
      "@type": "CollegeOrUniversity",
      "name": "Chung-Ang University"
    },
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Room B105-1, Bldg. 310, 84 Heukseok-ro, Dongjak-gu",
      "addressLocality": "Seoul",
      "postalCode": "06974",
      "addressCountry": "KR"
    }
  }
  </script>

  <!-- Google Fonts (렌더 블로킹 방지: 로드 후 적용) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 가변 폰트 범위로 요청 — src가 실제로 쓰는 웨이트는 Inter 300~900(font-light~font-black),
       Playfair Display 400~800(font-bold/font-extrabold)이다. 같은 가변 파일이라 추가 전송 바이트는 없다. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Playfair+Display:wght@400..800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Playfair+Display:wght@400..800&display=swap"
      rel="stylesheet">
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
