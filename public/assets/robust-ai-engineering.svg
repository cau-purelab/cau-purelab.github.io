<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Robust AI engineering</title>
<desc id="d">The same machine under attack: a press column on the left drives two red rams into its side while red arrows load it from above, heavy straps bolt it down to the bench, every model block inside stays lit, and the needle on the large instrument to the right sits dead centre in the safe band, nowhere near the red limits.</desc>

