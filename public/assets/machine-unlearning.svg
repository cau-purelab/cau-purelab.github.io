<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Machine unlearning</title>
<desc id="d">The same machine with its bay open: four model blocks are seated inside, one has been lifted out and set aside on the right stand, its slot left empty and outlined in red, while the three that remain stay lit and running.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FCFDFF"/><stop offset="1" stop-color="#EDF2F9"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#60A5FA" stop-opacity="0.50"/>
    <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DBEAFE"/>
  </linearGradient>
  <linearGradient id="faceM" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E2E8F0"/><stop offset="1" stop-color="#94A3B8"/>
  </linearGradient>
  <linearGradient id="faceD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/>
  </linearGradient>
  <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/>
  </linearGradient>
  <linearGradient id="faceC" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FEE2E2"/><stop offset="1" stop-color="#FCA5A5"/>
  </linearGradient>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F2557" flood-opacity="0.20"/>
  </filter>
  <filter id="softS" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#0F2557" flood-opacity="0.22"/>
  </filter>
</defs>

