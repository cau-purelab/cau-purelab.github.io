<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Machine unlearning</title><desc id="d">One record row of the embedding grid has been voided to dashed red outlines. The two hidden units that carried it are now empty dashed sockets, the connections along that branch survive only as a faint red dashed trace, and the single output it fed has collapsed to a stub inside a dashed ghost of its former height, while the other two outputs stay exactly as they were.</desc>
<defs>
<linearGradient id="gBg" x1="0" y1="0" x2="0.32" y2="1">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDF2F9"/>
</linearGradient>
<linearGradient id="gPlate" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/>
</linearGradient>
<radialGradient id="gHot" cx="0.34" cy="0.28" r="0.88">
  <stop offset="0" stop-color="#60A5FA"/><stop offset="0.55" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/>
</radialGradient>
<radialGradient id="gMid" cx="0.34" cy="0.28" r="0.88">
  <stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#2563EB"/>
</radialGradient>
<radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0.40" stop-color="#60A5FA" stop-opacity="0.46"/>
  <stop offset="0.70" stop-color="#60A5FA" stop-opacity="0.16"/>
  <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
</radialGradient>
<linearGradient id="gRedact" x1="0" y1="0" x2="0.6" y2="1">
  <stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#0F2557"/>
</linearGradient>
<linearGradient id="gDamp" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#DC2626"/><stop offset="0.34" stop-color="#EF4444"/>
  <stop offset="0.52" stop-color="#93C5FD"/><stop offset="1" stop-color="#2563EB"/>
</linearGradient>
<filter id="fSoft" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="18"/>
</filter>
</defs>
<rect width="1600" height="900" fill="url(#gBg)"/>

