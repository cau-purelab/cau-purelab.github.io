<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Privacy-preserving AI</title>
<desc id="d">A sealed machine on a bench: sensitive records travel from a supply tank along a wide pipe into the machine, the working face is bolted shut behind a heavy padlock so nothing inside can be seen, and only a thin line carries the finished model out to a lit stand on the right.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FCFDFF"/><stop offset="1" stop-color="#EDF2F9"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#60A5FA" stop-opacity="0.50"/>
    <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DBEAFE"/>
  </linearGradient>
  <linearGradient id="faceP" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/>
  </linearGradient>
  <linearGradient id="faceM" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E2E8F0"/><stop offset="1" stop-color="#94A3B8"/>
  </linearGradient>
  <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/>
  </linearGradient>
  <linearGradient id="faceC" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FEE2E2"/>
  </linearGradient>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
    <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#0F2557" flood-opacity="0.20"/>
  </filter>
  <filter id="softS" x="-30%" y="-30%" width="160%" height="170%">
